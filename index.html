<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Precios de modelos · Nous Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap">
<style>
  :root{
    --bg:#0c0d10; --s1:#14161b; --s2:#1b1e25; --s3:#252933;
    --ink:#eceef2; --muted:#a9b1c0; --marca:#f2b544;
    --up:#ff7a6b; --down:#4fd68a; --new:#7fb6ff; --foco:#ffffff;
    --accent:var(--marca); --pin:var(--marca);
    /* alias de compatibilidad: nada puede quedar sin resolver */
    --card:var(--s1); --border:var(--s2); --text:var(--ink);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%;overscroll-behavior:none}
  body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:22px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1200px;margin:0 auto;padding:32px}
  .vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  .head{padding-bottom:32px}
  h1{font-size:clamp(44px,6.4vw + 20px,76px);line-height:.95;letter-spacing:-.02em;font-weight:700;margin:0 0 20px;max-width:16ch}
  .board{display:flex;align-items:flex-start;justify-content:space-between;gap:24px}
  .meta{display:flex;flex-direction:column;gap:4px}
  .count{font-size:34px;line-height:37px;font-weight:700;font-variant-numeric:tabular-nums}
  .changes{font-size:20px;line-height:24px;font-weight:600;display:flex;gap:24px;flex-wrap:wrap}
  .changes .mv-up b{color:var(--up)} .changes .mv-down b{color:var(--down)} .changes .mv-new b{color:var(--new)}
  .changes .mv-none{color:var(--muted);font-weight:400}
  .prov{font-size:13px;line-height:18px;color:var(--muted)}
  .prov b{color:var(--ink);font-weight:600}
  .controls{margin-top:6px}
  .controls input{width:360px;height:48px;background:var(--s3);border:0;border-radius:10px;color:var(--ink);font:inherit;font-size:16px;padding:0 16px}
  .controls input::placeholder{color:var(--muted)}
  .controls input:focus-visible{outline:2px solid var(--foco);outline-offset:2px}
  @media (max-width:900px){ .board{flex-direction:column;align-items:stretch} .controls input{width:100%} }

  .pinned-wrap{background:var(--s1);border-radius:12px 12px 0 0;padding:24px;margin-bottom:0}
  .pinned-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px}
  .pinned-head .ttl{font-size:20px;line-height:24px;font-weight:700}
  .pinned-head .cnt{font-size:13px;line-height:18px;color:var(--muted)}
  .pin-sort{position:relative;display:flex;gap:4px;margin-left:auto;background:var(--s3);border-radius:10px;padding:4px;width:264px}
  .pin-sort button{position:relative;z-index:1;flex:1 1 0;min-width:0;height:36px;padding:0 8px;background:none;border:0;border-radius:8px;color:var(--muted);font:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
  .pin-sort::before{content:"";position:absolute;top:4px;left:4px;width:calc((100% - 16px) / 3);height:36px;background:var(--bg);border-radius:8px;transition:transform 220ms cubic-bezier(.2,.7,.2,1)}
  .pin-sort:has(button[data-mode="in"].on)::before{transform:translateX(calc(100% + 4px))}
  .pin-sort:has(button[data-mode="out"].on)::before{transform:translateX(calc(200% + 8px))}
  .pin-sort button.on{background:none;color:var(--ink)}
  .pin-sort button:focus-visible,#pin-clear:focus-visible,.pbtn:focus-visible,.unpin:focus-visible{outline:2px solid var(--foco);outline-offset:2px}
  #pin-clear{height:36px;padding:0 14px;background:none;border:0;border-radius:8px;color:var(--muted);font:inherit;font-size:13px;font-weight:600;cursor:pointer}
  #pin-clear:hover{color:var(--ink);background:var(--s3)}
  .pinned-list{display:grid;grid-template-columns:1fr;gap:8px}
  .pin-card{background:var(--s2);border-radius:10px;padding:10px 16px;display:grid;
            grid-template-columns:20px minmax(0,1fr) 128px 128px 104px 76px 84px;gap:16px;align-items:center;
            border-top:2px solid transparent;border-bottom:2px solid transparent}
  .pin-card.dragging{opacity:.45}
  .pin-card .pin-handle{display:flex;align-items:center;color:var(--muted);cursor:grab;user-select:none;touch-action:none}
  .pin-card .pname{font-size:16px;line-height:22px;font-weight:600}
  .pin-card .pmid{font-size:13px;line-height:18px;color:var(--muted)}
  .pin-card .pprices{display:contents}
  .pin-card .pprices > span{font-size:13px;line-height:18px;color:var(--muted)}
  .pin-card .pprices b{display:block;font-size:20px;line-height:24px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
  .pin-card .pprices > span:nth-child(3)::before{content:"Contexto";display:block}
  .pbtns{display:flex;gap:4px;margin-left:auto}
  .pbtn{width:36px;height:36px;background:var(--s3);border:0;border-radius:8px;color:var(--ink);cursor:pointer;font:inherit;font-size:13px}
  .pbtn:disabled{opacity:.4;cursor:default}
  .unpin{align-self:center;height:36px;padding:0 14px;background:none;border:0;border-radius:8px;color:var(--muted);font:inherit;font-size:13px;font-weight:600;cursor:pointer}
  .unpin:hover{color:var(--up)}

  .table-wrap{margin-top:0}
  .table-x{overflow:visible}
  table{width:100%;border-collapse:collapse}
  thead th{position:sticky;top:0;z-index:2;background:var(--bg);height:52px;padding:0;text-align:left;font-weight:600}
  th.pin-col{width:64px}
  th.pin-col svg{width:15px;height:15px;vertical-align:middle;color:var(--muted)}
  th.num{width:200px;text-align:right}
  th[data-key="ctx"]{width:136px}
  thead th button{width:100%;height:44px;background:var(--s2);border:0;border-radius:8px;color:var(--ink);font:inherit;font-size:13px;font-weight:600;letter-spacing:.01em;cursor:pointer;padding:0 12px;display:flex;align-items:center;gap:8px}
  thead th.num button{justify-content:flex-end}
  thead th .unit{color:var(--muted);font-weight:400}
  thead th:has(.arrow:not(:empty)) button{background:var(--marca);color:var(--bg)}
  thead th:has(.arrow:not(:empty)) .unit{color:inherit;opacity:.7}
  thead th button:focus-visible{outline-offset:-3px}
  tbody td{padding:6px 0;border-top:1px solid var(--s2);vertical-align:top}
  tbody tr:hover{background:var(--s2)}
  td.num{text-align:right;font-size:20px;line-height:24px;font-weight:600;font-variant-numeric:tabular-nums}
  td.num .badge{display:block;font-size:13px;line-height:18px;font-weight:600}
  .mname{font-size:16px;line-height:22px;font-weight:600;cursor:pointer}
  .mname:hover{color:var(--marca)}
  .mid{font-size:13px;line-height:18px;color:var(--muted)}
  .ctx{font-size:16px;line-height:22px;color:var(--muted)}
  .pin-col{text-align:center}
  .pin-btn{width:44px;height:44px;background:none;border:0;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;font:inherit}
  .pin-btn:hover{color:var(--ink);background:var(--s2)}
  .pin-btn.on{color:var(--bg);background:var(--marca)}
  .pin-btn svg{width:15px;height:15px}
  .pin-btn.on svg{fill:currentColor}
  .badge.b-up{color:var(--up)}
  .badge.b-down{color:var(--down)}
  .badge.b-new{display:inline-block;font-size:13px;line-height:18px;font-weight:600;color:var(--new);margin-left:8px}
  tr.pinned-row{background:var(--s1)}
  tr.pinned-row + tr:not(.pinned-row) td{border-top:8px solid var(--bg)}
  #empty{padding:40px 0;font-size:20px;color:var(--muted)}
  .empty{padding:40px 0;font-size:16px;line-height:24px;color:var(--muted)}
  footer{font-size:16px;line-height:24px;color:var(--muted);max-width:60ch;padding:40px 0 0}

  /* Modal histórico */
  .hist-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .hist-overlay.open{display:flex}
  .hist-panel{background:var(--s2);border:0;border-radius:14px 14px 0 0;width:100%;max-width:720px;
    max-height:78vh;display:flex;flex-direction:column;padding:24px 24px calc(24px + env(safe-area-inset-bottom))}
  .hist-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}
  .hist-head .ht{flex:1;min-width:0}
  .hist-head .ht b{font-size:34px;line-height:38px;font-weight:700;display:block}
  .hist-head .ht span{color:var(--muted);font-size:13px;line-height:18px;word-break:break-all}
  .hist-close{background:transparent;border:0;color:var(--muted);cursor:pointer;padding:8px;border-radius:8px;display:flex;align-items:center;justify-content:center;font:inherit}
  .hist-close:hover{color:var(--ink);background:var(--s3)}
  .hist-body{overflow-y:auto;min-height:0}
  .hist-table{width:100%;border-collapse:collapse;font-size:13px;min-width:0}
  .hist-table th{position:sticky;top:0;background:var(--s3);text-align:left;padding:10px 12px;border-bottom:1px solid var(--s1);font-weight:600;font-size:13px;white-space:nowrap}
  .hist-table td{padding:10px 12px;border-bottom:1px solid var(--s1);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:13px}
  .hist-table td:last-child{text-align:right}
  .hist-empty{padding:24px;text-align:center;color:var(--muted);font-size:16px}
  .hist-chg-up{color:var(--up)}
  .hist-chg-down{color:var(--down)}

  /* Foco visible */
  a:focus-visible,button:focus-visible,input:focus-visible,[tabindex]:focus-visible{
    outline:2px solid var(--foco);outline-offset:2px}

  /* Movimiento */
  @keyframes sube{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes entra{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .wrap{animation:entra 420ms cubic-bezier(.2,.7,.2,1) both}
  .head{animation:entra 420ms cubic-bezier(.2,.7,.2,1) 20ms both}
  h1{animation:sube 560ms cubic-bezier(.2,.7,.2,1) 40ms both}
  .board{animation:entra 420ms cubic-bezier(.2,.7,.2,1) 60ms both}
  #meta-count{animation:sube 420ms cubic-bezier(.2,.7,.2,1) 80ms both}
  .changes .mv-up,.changes .mv-down,.changes .mv-new,.changes .mv-none{animation:entra 420ms cubic-bezier(.2,.7,.2,1) both}
  .changes .mv-up{animation-delay:100ms}.changes .mv-down{animation-delay:120ms}.changes .mv-new{animation-delay:140ms}.changes .mv-none{animation-delay:100ms}
  .prov{animation:entra 420ms cubic-bezier(.2,.7,.2,1) 120ms both}
  .controls{animation:entra 420ms cubic-bezier(.2,.7,.2,1) 140ms both}
  .controls input{animation:entra 420ms cubic-bezier(.2,.7,.2,1) 160ms both}
  .table-x{animation:entra 420ms cubic-bezier(.2,.7,.2,1) 140ms both}
  thead tr{animation:entra 420ms cubic-bezier(.2,.7,.2,1) 140ms both}
  thead th{animation:entra 420ms cubic-bezier(.2,.7,.2,1) both}
  thead th:nth-child(1){animation-delay:160ms}
  thead th:nth-child(2){animation-delay:180ms}
  thead th:nth-child(3){animation-delay:200ms}
  thead th:nth-child(4){animation-delay:220ms}
  thead th:nth-child(5){animation-delay:240ms}
  footer{animation:entra 420ms cubic-bezier(.2,.7,.2,1) 240ms both}
  .mname{transition:transform 160ms cubic-bezier(.2,.7,.2,1)}
  tr:hover .mname{transform:translateX(3px)}
  .pin-btn{transition:background-color 160ms,color 160ms,transform 90ms}
  .pin-btn:active{transform:scale(.86)}
  thead th button{transition:transform 90ms,background-color 160ms}
  thead th button:active{transform:scale(.97)}
  .arrow{transition:opacity 160ms,transform 160ms}
  #pinned-wrap{animation:entra 280ms cubic-bezier(.2,.7,.2,1) both}
  .pin-card{transition:transform 120ms,opacity 120ms}
  .pbtn:active{transform:scale(.92)}
  .hist-overlay{opacity:0;transition:opacity 280ms,display 280ms allow-discrete}
  .hist-overlay.open{opacity:1}
  @starting-style{.hist-overlay.open{opacity:0}}
  .hist-overlay:not(.open){pointer-events:none}
  .hist-overlay:not(.open) .hist-panel{transform:translateY(24px)}
  .hist-overlay.open .hist-panel{transform:none}
  @starting-style{.hist-overlay.open .hist-panel{transform:translateY(24px)}}
  .hist-panel{transition:transform 280ms cubic-bezier(.2,.7,.2,1)}
  #empty{animation:entra 220ms cubic-bezier(.2,.7,.2,1) both}
  #pin-clear:active,.hist-close:active{transform:scale(.96)}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}}

  @media (max-width:960px){
    .pin-card{grid-template-columns:minmax(0,1fr) auto auto;gap:10px 12px;padding:14px}
    .pin-card > div:first-of-type{grid-column:1/-1;grid-row:1}
    .pin-card .pprices{display:flex;gap:20px;flex-wrap:wrap;grid-column:1/-1;grid-row:2}
    .pin-card .pbtns{grid-column:2;grid-row:3;justify-self:end}
    .pin-card .unpin{grid-column:3;grid-row:3;align-self:center}
  }

  /* Móvil */
  @media (max-width:640px){
    .wrap{padding:20px}
    table,tbody,thead{display:block;min-width:0;width:auto}
    thead{position:sticky;top:0;z-index:3;background:var(--bg);padding-bottom:8px}
    thead tr{display:flex;gap:4px}
    thead th{width:auto;flex:1 1 0;height:44px}
    thead th.pin-col,thead th .unit{display:none}
    thead th button{height:44px;justify-content:center;padding:0 6px}
    tbody tr{display:grid;grid-template-columns:auto auto 1fr 44px;
             grid-template-areas:"name name name pin" "in out ctx pin";
             gap:8px;padding:16px 0;height:auto}
    tbody td{display:block;padding:0;border:0}
    tbody td.empty{grid-column:1/-1}
    td.pin-col{grid-area:pin;align-self:center}
    tbody td:nth-child(2){grid-area:name}
    tbody td:nth-child(3){grid-area:in}
    tbody td:nth-child(4){grid-area:out}
    tbody td:nth-child(5){grid-area:ctx}
    tbody td:nth-child(3)::before{content:"In ";font-size:13px;line-height:18px;color:var(--muted);font-weight:400}
    tbody td:nth-child(4)::before{content:"Out ";font-size:13px;line-height:18px;color:var(--muted);font-weight:400}
    tbody td:nth-child(5)::before{content:"Contexto ";font-size:13px;line-height:18px;color:var(--muted);font-weight:400}
    td.num{text-align:left}
    .mname,.mid{overflow-wrap:anywhere}
    /* el comparador */
    .pinned-head{display:grid;grid-template-columns:1fr auto;gap:12px}
    .pinned-head .pin-sort{grid-column:1/-1;width:100%;margin-left:0;order:3}
    .pin-card .pin-handle{display:none}
    .pbtn{width:44px;height:44px}
    .unpin,#pin-clear,.pin-sort button{height:44px}
    .pin-sort::before{height:44px}
    /* el histórico */
    .hist-panel{width:100%;max-width:100%;max-height:88vh}
    .hist-panel .hist-table td,.hist-panel .hist-table th{white-space:normal;overflow-wrap:anywhere}
    .hist-close{min-width:44px;min-height:44px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <h1>Precios de modelos</h1>
    <div class="board">
      <div class="meta">
        <span class="count" id="meta-count"></span>
        <span class="changes" id="meta-changes"></span>
        <span class="prov"><span id="meta-date"></span></span>
      </div>
      <div class="controls">
        <label class="vh" for="search">Buscar modelo</label>
        <input id="search" type="search" placeholder="Buscar modelo…" autocomplete="off">
      </div>
    </div>
  </header>

  <div class="pinned-wrap" id="pinned-wrap" style="display:none">
    <div class="pinned-head">
      <span class="ttl">Anclados</span>
      <span class="cnt" id="pin-count"></span>
      <div class="pin-sort" id="pin-sort">
        <button data-mode="" class="on">Manual</button>
        <button data-mode="in">Por In</button>
        <button data-mode="out">Por Out</button>
      </div>
      <button id="pin-clear">Quitar todos</button>
    </div>
    <div class="pinned-list" id="pin-list"></div>
  </div>

  <div class="table-wrap">
    <div class="table-x">
      <table>
        <thead>
          <tr>
            <th class="pin-col" title="Anclar para comparar"><span class="vh">Anclar</span><svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M5.2 2.4h5.6l-.9 4.3 2.1 2.1H4l2.1-2.1z"/><path d="M8 8.8V14"/></svg></th>
            <th data-key="name"><button type="button">Modelo <span class="arrow"></span></button></th>
            <th data-key="in" class="num"><button type="button">Input <span class="unit">$/1M</span> <span class="arrow"></span></button></th>
            <th data-key="out" class="num"><button type="button">Output <span class="unit">$/1M</span> <span class="arrow"></span></button></th>
            <th data-key="ctx" class="num"><button type="button">Contexto <span class="arrow"></span></button></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="empty" class="empty" style="display:none">Sin resultados</div>
    </div>
  </div>

  <footer>Precios de entrada y salida por millón de tokens. Fuente: inference-api de Nous Portal. Se actualiza cada día.</footer>
</div>

<div class="hist-overlay" id="hist-overlay" role="dialog" aria-labelledby="hist-name">
  <div class="hist-panel">
    <div class="hist-head">
      <div class="ht">
        <b id="hist-name"></b>
        <span id="hist-id"></span>
      </div>
      <button class="hist-close" id="hist-close" title="Cerrar"><span class="vh">Cerrar</span><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 4l8 8M12 4L4 12"/></svg></button>
    </div>
    <div class="hist-body" id="hist-body"></div>
  </div>
</div>

<script src="config.js"></script>
<script>
"use strict";
let models = [];
let sortKey = "in", sortDir = 1;
let pinnedIds = [];
let pinSort = "";   // "" manual | "in" | "out"
let historyData = {};   // id -> [{ts, in, out}, ...]
try { pinnedIds = JSON.parse(localStorage.getItem("np_pinned") || "[]"); } catch(e) { pinnedIds = []; }
const $ = (s) => document.querySelector(s);

function fmtUsd(v){
  if (v == null) return "—";
  const s = v < 0.01 ? v.toFixed(4) : v.toFixed(2);
  return "$" + s;
}
function fmtCtx(n){
  if (!n) return "—";
  if (n >= 1e6) return (n/1e6).toFixed(1) + "M";
  return Math.round(n/1000) + "K";
}
function badgeFor(change, key){
  if (!change || !change[key]) return "";
  const pct = change[key].pct;
  if (pct === null || pct === undefined || Math.abs(pct) < 0.05) return "";
  const cls = pct > 0 ? "b-up" : "b-down";
  const arrow = pct > 0 ? "▲" : "▼";
  return `<span class="badge ${cls}">${arrow} ${Math.abs(pct).toFixed(1)}%</span>`;
}
function savePinned(){
  try { localStorage.setItem("np_pinned", JSON.stringify(pinnedIds)); } catch(e) {}
}
const PIN_TOKEN = window.PIN_TOKEN || "";
function syncPinsRemote(){
  fetch("pin.php", {
    method: "POST",
    headers: {"Content-Type": "application/json", "X-Pin-Token": PIN_TOKEN},
    body: JSON.stringify({ids: pinnedIds})
  }).catch(() => {});
}
function loadPinsRemote(){
  return fetch("pin.php", {cache: "no-store"})
    .then(r => r.ok ? r.json() : null)
    .then(d => {
      const remote = (d && Array.isArray(d.ids)) ? d.ids : [];
      // MERGE (nunca sobrescribir): los pines remotos primero, luego los
      // locales que falten. Así un servidor vacío no borra los del navegador
      // y viceversa. Si el resultado difiere de lo remoto, converger (POST).
      const merged = [...remote];
      for (const id of pinnedIds) {
        if (!merged.includes(id)) merged.push(id);
      }
      const changed = merged.length !== remote.length ||
        merged.some((id, i) => id !== remote[i]);
      pinnedIds = merged;
      savePinned();
      if (changed) syncPinsRemote();
    })
    .catch(() => {});
}
function isPinned(id){ return pinnedIds.includes(id); }

function togglePin(id){
  const i = pinnedIds.indexOf(id);
  if (i >= 0) pinnedIds.splice(i, 1); else pinnedIds.push(id);
  savePinned();
  syncPinsRemote();
  applySort();
  render();
  renderPinned();
}
function setPinSort(mode){
  pinSort = mode || "";
  document.querySelectorAll("#pin-sort button").forEach(b => b.classList.toggle("on", b.dataset.mode === pinSort));
  applySort();
  renderPinned();
}
function movePin(id, dir){
  const i = pinnedIds.indexOf(id);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= pinnedIds.length) return;
  pinnedIds.splice(i, 1);
  pinnedIds.splice(j, 0, id);
  pinSort = "";                 // reordenación manual -> salir del modo precio
  savePinned();
  syncPinsRemote();
  applySort();
  renderPinned();
}
function orderedPinned(){
  const list = pinnedIds.map(id => models.find(m => m.id === id)).filter(Boolean);
  if (pinSort === "in" || pinSort === "out"){
    list.sort((a, b) => (a[pinSort] ?? 0) - (b[pinSort] ?? 0));
  }
  return list;
}

function renderPinned(){
  const wrap = $("#pinned-wrap");
  const list = $("#pin-list");
  if (!wrap || !list) return;
  const pinned = orderedPinned();
  if (!pinned.length){
    wrap.style.display = "none";
    return;
  }
  wrap.style.display = "block";
  $("#pin-count").textContent = pinned.length + (pinned.length === 1 ? " modelo anclado" : " modelos anclados");
  document.querySelectorAll("#pin-sort button").forEach(b => b.classList.toggle("on", b.dataset.mode === pinSort));
  list.innerHTML = pinned.map((m, idx) => {
    const n = pinned.length;
    const first = idx === 0, last = idx === n - 1;
    return `
    <div class="pin-card" draggable="true" data-id="${m.id}">
      <span class="pin-handle" title="Arrastrar"><svg viewBox="0 0 10 16" width="10" height="16" aria-hidden="true" fill="currentColor"><circle cx="3" cy="3" r="1.4"/><circle cx="7" cy="3" r="1.4"/><circle cx="3" cy="8" r="1.4"/><circle cx="7" cy="8" r="1.4"/><circle cx="3" cy="13" r="1.4"/><circle cx="7" cy="13" r="1.4"/></svg></span>
      <div style="flex:1;min-width:180px">
        <div class="pname" data-id="${m.id}" title="Ver histórico" style="cursor:pointer">${m.name}<span class="badge ${m.new ? "b-new" : ""}" style="${m.new ? "" : "display:none"}">NUEVO</span></div>
        <div class="pmid">${m.id}</div>
      </div>
      <div class="pprices">
        <span>In <b>${fmtUsd(m.in)}</b></span>
        <span>Out <b>${fmtUsd(m.out)}</b></span>
        <span>${fmtCtx(m.ctx)}</span>
      </div>
      <div class="pbtns">
        <button class="pbtn" data-move="-1" title="Subir" ${first ? "disabled" : ""}>▲</button>
        <button class="pbtn" data-move="1" title="Bajar" ${last ? "disabled" : ""}>▼</button>
      </div>
      <button class="unpin" title="Quitar" data-id="${m.id}">Quitar</button>
    </div>`;
  }).join("");

  list.querySelectorAll(".pbtn").forEach(btn =>
    btn.addEventListener("click", () => movePin(btn.closest(".pin-card").dataset.id, parseInt(btn.dataset.move, 10))));
  list.querySelectorAll(".unpin").forEach(btn =>
    btn.addEventListener("click", () => togglePin(btn.dataset.id)));
  list.querySelectorAll(".pname").forEach(el =>
    el.addEventListener("click", e => { if (!e.target.closest(".badge")) showHistory(el.dataset.id); }));

  // drag & drop (escritorio)
  let dragId = null;
  list.querySelectorAll(".pin-card").forEach(card => {
    card.addEventListener("dragstart", e => {
      dragId = card.dataset.id;
      card.classList.add("dragging");
      try { e.dataTransfer.setData("text/plain", dragId); e.dataTransfer.effectAllowed = "move"; } catch(_) {}
    });
    card.addEventListener("dragover", e => {
      e.preventDefault();
      const rect = card.getBoundingClientRect();
      const before = e.clientY < rect.top + rect.height / 2;
      e.dataTransfer.dropEffect = "move";
      card.style.borderTop = before ? "2px solid var(--accent)" : "";
      card.style.borderBottom = before ? "" : "2px solid var(--accent)";
    });
    card.addEventListener("dragleave", () => {
      card.style.borderTop = ""; card.style.borderBottom = "";
    });
    card.addEventListener("drop", e => {
      e.preventDefault();
      card.style.borderTop = ""; card.style.borderBottom = "";
      if (!dragId || dragId === card.dataset.id) return;
      const rect = card.getBoundingClientRect();
      const before = e.clientY < rect.top + rect.height / 2;
      const from = pinnedIds.indexOf(dragId);
      let to = pinnedIds.indexOf(card.dataset.id);
      pinnedIds.splice(from, 1);
      to = pinnedIds.indexOf(card.dataset.id);
      pinnedIds.splice(before ? to : to + 1, 0, dragId);
      pinSort = "";
      savePinned();
      syncPinsRemote();
      applySort();
      renderPinned();
    });
    card.addEventListener("dragend", () => {
      card.classList.remove("dragging");
      card.style.borderTop = ""; card.style.borderBottom = "";
      dragId = null;
    });
  });
}

function applySort(){
  const dir = sortDir;
  const idx = (id) => { const i = pinnedIds.indexOf(id); return i === -1 ? Infinity : i; };
  models.sort((a, b) => {
    const ia = idx(a.id), ib = idx(b.id);
    if (ia !== ib) return ia - ib;            // anclados primero, en su orden
    if (sortKey === "name") return a.name.localeCompare(b.name) * dir;
    return ((a[sortKey] ?? 0) - (b[sortKey] ?? 0)) * dir;
  });
}

function showHistory(id){
  const m = models.find(x => x.id === id);
  const hist = historyData[id] || [];
  $("#hist-name").textContent = m ? m.name : id;
  $("#hist-id").textContent = id;
  const body = $("#hist-body");
  if (!hist.length){
    body.innerHTML = `<div class="hist-empty">Sin histórico todavía (los cambios se registran a partir de ahora).</div>`;
  } else {
    let rows = "";
    let prev = null;
    for (const h of hist){
      const when = new Date(h.ts).toLocaleString("es-ES", {dateStyle:"short", timeStyle:"short"});
      let inCell = fmtUsd(h.in), outCell = fmtUsd(h.out);
      if (prev){
        const din = h.in - prev.in, dout = h.out - prev.out;
        if (Math.abs(din) > 1e-9) inCell += ` <span class="${din > 0 ? "hist-chg-up" : "hist-chg-down"}">${din > 0 ? "▲" : "▼"}${fmtUsd(Math.abs(din))}</span>`;
        if (Math.abs(dout) > 1e-9) outCell += ` <span class="${dout > 0 ? "hist-chg-up" : "hist-chg-down"}">${dout > 0 ? "▲" : "▼"}${fmtUsd(Math.abs(dout))}</span>`;
      }
      rows += `<tr><td>${when}</td><td>${inCell}</td><td>${outCell}</td></tr>`;
      prev = h;
    }
    body.innerHTML = `<table class="hist-table"><thead><tr><th>Fecha</th><th>Input $/1M</th><th>Output $/1M</th></tr></thead><tbody>${rows}</tbody></table>`;
  }
  $("#hist-overlay").classList.add("open");
}
function closeHistory(){
  $("#hist-overlay").classList.remove("open");
}

const PIN_SVG = '<svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M5.2 2.4h5.6l-.9 4.3 2.1 2.1H4l2.1-2.1z"/><path d="M8 8.8V14"/></svg>';

function render(){
  const q = $("#search").value.trim().toLowerCase();
  const rows = models.filter(m => !q || m.name.toLowerCase().includes(q) || m.id.toLowerCase().includes(q));
  const tbody = $("#rows");
  tbody.innerHTML = "";
  $("#empty").style.display = rows.length ? "none" : "block";
  for (const m of rows){
    const pinned = isPinned(m.id);
    const tr = document.createElement("tr");
    if (pinned) tr.className = "pinned-row";
    tr.innerHTML = `
      <td class="pin-col"><button class="pin-btn ${pinned ? "on" : ""}" aria-pressed="${pinned ? "true" : "false"}" title="${pinned ? "Quitar del comparador" : "Anclar para comparar"}" data-id="${m.id}">${PIN_SVG}</button></td>
      <td><div class="mname" data-id="${m.id}" title="Ver histórico">${m.name}${m.new ? `<span class="badge b-new">NUEVO</span>` : ""}</div><div class="mid">${m.id}</div></td>
      <td class="num">${fmtUsd(m.in)}${badgeFor(m.change, "in")}</td>
      <td class="num">${fmtUsd(m.out)}${badgeFor(m.change, "out")}</td>
      <td class="num"><span class="ctx">${fmtCtx(m.ctx)}</span></td>
    `;
    tbody.appendChild(tr);
  }
  tbody.querySelectorAll(".pin-btn").forEach(btn =>
    btn.addEventListener("click", () => togglePin(btn.dataset.id)));
  tbody.querySelectorAll(".mname").forEach(el =>
    el.addEventListener("click", () => showHistory(el.dataset.id)));
  document.querySelectorAll("thead th").forEach(th => {
    if (!th.dataset.key) return;
    const arrow = th.querySelector(".arrow");
    arrow.textContent = th.dataset.key === sortKey ? (sortDir === 1 ? "▲" : "▼") : "";
  });
}

function sort(key){
  if (key === sortKey) { sortDir *= -1; } else { sortKey = key; sortDir = 1; }
  applySort();
  render();
}

$("#pin-clear").addEventListener("click", () => { pinnedIds = []; savePinned(); syncPinsRemote(); applySort(); render(); renderPinned(); });
$("#hist-close").addEventListener("click", closeHistory);
$("#hist-overlay").addEventListener("click", e => { if (e.target.id === "hist-overlay") closeHistory(); });
document.querySelectorAll("#pin-sort button").forEach(b => b.addEventListener("click", () => setPinSort(b.dataset.mode)));
$("#search").addEventListener("input", render);
document.querySelectorAll("thead th").forEach(th => th.addEventListener("click", () => { if (th.dataset.key) sort(th.dataset.key); }));

fetch("prices.json", {cache: "no-store"})
  .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .then(doc => {
    models = doc.models || [];
    $("#meta-date").textContent = "Actualizado: " + new Date(doc.generated_at).toLocaleString("es-ES", {dateStyle:"short", timeStyle:"short"});
    $("#meta-count").textContent = doc.total + " modelos";
    const ups = models.filter(m => (m.change.in && m.change.in.pct > 0) || (m.change.out && m.change.out.pct > 0)).length;
    const downs = models.filter(m => (m.change.in && m.change.in.pct < 0) || (m.change.out && m.change.out.pct < 0)).length;
    const news = models.filter(m => m.new).length;
    const parts = [];
    if (ups) parts.push(`<span class="mv-up"><b>▲ ${ups}</b> subieron</span>`);
    if (downs) parts.push(`<span class="mv-down"><b>▼ ${downs}</b> bajaron</span>`);
    if (news) parts.push(`<span class="mv-new"><b>${news}</b> nuevos</span>`);
    $("#meta-changes").innerHTML = parts.length ? parts.join("") : '<span class="mv-none">Sin cambios hoy</span>';
    return Promise.all([loadPinsRemote(),
      fetch("history.json", {cache: "no-store"})
        .then(r => r.ok ? r.json() : {})
        .then(h => { historyData = h || {}; })
        .catch(() => { historyData = {}; })]);
  })
  .then(() => {
    pinnedIds = pinnedIds.filter(id => models.some(m => m.id === id));
    savePinned();
    sortKey = "in"; sortDir = 1;
    applySort();
    render();
    renderPinned();
  })
  .catch(e => {
    $("#rows").innerHTML = `<tr><td colspan="5" class="empty">No se pudo cargar prices.json (${e.message})</td></tr>`;
  });
</script>
</body>
</html>
